name: Build full Vite migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run migration
        run: node scripts/migrate-to-vite.mjs

      - name: Install and build
        run: |
          npm install
          npm run db:generate
          npm run db:push
          npm run build

      - name: Remove migration scaffolding
        run: rm -rf scripts/migrate-to-vite.mjs .github/workflows/full-migration.yml

      - name: Commit migrated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Vite and npm migration [skip ci]"
          git push
